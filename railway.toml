# Configuration Railway (lue à chaque déploiement, prioritaire sur l'interface).
# Réglages à faire dans l'interface, non exprimables ici : volume monté sur /data,
# 1 seule réplique, « App Sleeping » désactivé, région Europe, port cible du domaine 8080,
# variables BINOME_ADMIN_PASSWORD_HASH / BINOME_ADMIN_PSEUDO / BINOME_DELETE_PASSWORD_HASH.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"

[deploy]
# <BINOME_PUBLIC_PREFIX>/up — à adapter si l'application n'est pas à la racine
healthcheckPath = "/up"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
