[package]
name = "binome"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "multipart", "macros"] }
base64 = "0.23.1"
deunicode = "1.6.2"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
imagesize = "0.15.0"
rand = "0.10.3"
rusqlite = { version = "0.42.0", features = ["bundled", "collation"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tower-http = { version = "0.7.1", features = ["fs", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1.13.3"

[dev-dependencies]

# Binaire de production : petit et sobre (le serveur passe son temps à attendre le réseau).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
