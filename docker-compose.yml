# Binome en production : UN conteneur (serveur Rust + front compilé), données dans
# un volume SQLite. Ni MySQL, ni PHP, ni Node, ni worker de queue.
#
#   cp .env.example .env            # mot de passe d'administration
#   docker compose up -d --build    # http://<hôte>:8080/binome/
#
# Variantes (fichiers à ajouter avec -f) :
#   docker-compose.https.yml    VPS : HTTPS automatique (Caddy + Let's Encrypt)
#   docker-compose.portail.yml  réseau local derrière ../portail (killiadmin.local:8095)
# Développement (Vite HMR + cargo run) : docker-compose.dev.yml, à utiliser seul.

name: binome

services:
  binome:
    build:
      context: .
      args:
        PUBLIC_PREFIX: ${BINOME_PUBLIC_PREFIX:-/binome}
    image: binome:latest
    container_name: binome
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      BINOME_PUBLIC_PREFIX: ${BINOME_PUBLIC_PREFIX:-/binome}
    ports:
      - "${BINOME_PORT:-8080}:8080"
    volumes:
      - binome_data:/data
      # Catalogue de personnages à importer (docs/generation-personnages.md), lecture seule
      - ./data/characters:/import:ro
    # Durcissement : système de fichiers en lecture seule (hors /data), aucun privilège
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  binome_data:
