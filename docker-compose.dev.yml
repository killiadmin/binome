# Développement : serveur Rust (cargo run) + serveur Vite (HMR) qui relaie /binome/api
# et /binome/ws vers lui. À utiliser SEUL (pas avec docker-compose.yml) :
#
#   docker compose -f docker-compose.dev.yml up
#   docker compose -f docker-compose.dev.yml restart server     # après une modification Rust
#
# Front : http://localhost:5173/binome/ (et killiadmin.local:8095/binome/ via ../portail).
# Base de dev : volume `binome_dev_data` (vide au départ : le schéma est créé tout seul).

name: binome_dev

services:
  server:
    image: rust:1-bookworm
    working_dir: /app
    command: cargo run -- serve
    env_file:
      - path: .env
        required: false
    environment:
      BINOME_BIND: 0.0.0.0:8080
      BINOME_DATABASE: /data/binome.sqlite
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
      - binome_cargo_registry:/usr/local/cargo/registry
      - binome_cargo_target:/app/target
      - binome_dev_data:/data
      - ./data/characters:/import:ro

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      VITE_PROXY_SERVER: http://server:8080
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - binome_dev_node_modules:/app/node_modules
    depends_on:
      - server
    networks:
      default:
      meszappli:
        aliases: [binome_frontend]

networks:
  meszappli:
    name: meszappli
    external: true

volumes:
  binome_dev_data:
  binome_dev_node_modules:
  # Partagés avec server/cargo.sh : compilations incrémentales
  binome_cargo_registry:
    external: true
  binome_cargo_target:
    external: true
